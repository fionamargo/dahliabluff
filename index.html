  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">05<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">The Kitchen<\u002Fspan><\u002Fdiv>\n              <div data-go=\"7\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">06<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">Good to Know<\u002Fspan><\u002Fdiv>\n              <div data-go=\"8\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">07<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">House Rules<\u002Fspan><\u002Fdiv>\n              <div data-go=\"9\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">08<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">Power &amp; Safety<\u002Fspan><\u002Fdiv>\n              <div data-go=\"10\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">09<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">Getting Here<\u002Fspan><\u002Fdiv>\n              <div data-go=\"11\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">10<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">Explore the Island<\u002Fspan><\u002Fdiv>\n              <div data-go=\"12\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">11<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">Eat &amp; Drink Nearby<\u002Fspan><\u002Fdiv>\n              <div data-go=\"13\" style=\"display:flex;align-items:baseline;gap:12px;padding:9px 6px;border-bottom:1px solid #e7ddc9;cursor:pointer;\"><span style=\"font:600 12px/1 'Schibsted Grotesk';color:#b0a079;width:20px;\">12<\u002Fspan><span style=\"font:500 16px/1.2 'Hanken Grotesk';color:#2a3d49;\">Checkout<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 2 · WELCOME ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);\">\n          <div style=\"height:100%;overflow-y:auto;padding:56px 64px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">01 · Welcome<\u002Fdiv>\n            <h2 style=\"font:700 44px/1.02 'Schibsted Grotesk';letter-spacing:-0.02em;color:#20303d;margin:14px 0 22px;max-width:640px;\">Welcome to Dahlia Bluff<\u002Fh2>\n            <p style=\"font:400 17.5px/1.65 'Hanken Grotesk';color:#46555f;margin:0 0 16px;max-width:680px;\">Exhale, you've arrived. Dahlia Bluff is a 1932 beach cottage perched above Puget Sound, with 180° views of the water, Mount Baker, and the Seattle skyline. Every detail here was chosen to help you slow down and settle in.<\u002Fp>\n            <p style=\"font:400 17.5px/1.65 'Hanken Grotesk';color:#46555f;margin:0 0 28px;max-width:680px;\">This little guide has everything you need for an easy stay: Wi-Fi, the hot tub, the quirks of a 90-year-old cottage, and our favorite spots a short walk away. Make yourself at home.<\u002Fp>\n            <div style=\"font:500 16px/1.5 'Schibsted Grotesk';color:#35586f;margin:0 0 26px;\">Shannon &amp; Fiona, your hosts<\u002Fdiv>\n            <div onclick=\"{{ openLightbox }}\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:760px;\">\n              <img data-full=\"https://a0.muscache.com/im/pictures/e9398d2f-3900-4416-b148-a0ba4272af97.jpg?im_w=1200\" src=\"23d4c237-0933-4c47-a251-488151dcb7ee\" alt=\"Deck\" style=\"width:100%;height:100px;object-fit:cover;border-radius:6px;cursor:pointer;\">\n              <img data-full=\"https://a0.muscache.com/im/pictures/4465e92c-59df-49c6-9ff6-cdebe6ddfb84.jpg?im_w=1200\" src=\"e5ad039b-923c-4440-b053-f76bd89cc712\" alt=\"View\" style=\"width:100%;height:100px;object-fit:cover;border-radius:6px;cursor:pointer;\">\n              <img data-full=\"https://a0.muscache.com/im/pictures/43abe654-2f7c-4896-a101-7cdd598069f8.jpg?im_w=1200\" src=\"49503c7c-ea27-42bc-b041-598150aca7eb\" alt=\"Interior\" style=\"width:100%;height:100px;object-fit:cover;border-radius:6px;cursor:pointer;\">\n              <img data-full=\"https://a0.muscache.com/im/pictures/86665279-cf8b-472d-9350-13c37fcfcf72.jpg?im_w=1200\" src=\"cd7b0eb1-d366-4abc-b784-8400a4dc74b2\" alt=\"Living space\" style=\"width:100%;height:100px;object-fit:cover;border-radius:6px;cursor:pointer;\">\n              <img data-full=\"https://a0.muscache.com/im/pictures/77122ba7-2002-470e-8403-d3f5d719dc7b.jpg?im_w=1200\" src=\"db1059a7-f8a0-4cd4-aef3-a0908ccb1123\" alt=\"King bedroom\" style=\"width:100%;height:100px;object-fit:cover;border-radius:6px;cursor:pointer;\">\n            <\u002Fdiv>\n            <div style=\"font:400 12px/1 'Hanken Grotesk';color:#9a8f7b;margin-top:9px;letter-spacing:.02em;\">Tap a photo to enlarge<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 3 · ARRIVAL ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"e0d62afc-5a30-491c-b952-25239432ad6e\" alt=\"Cottage interior\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 56px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">02 · Arrival<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 22px;\">Arrival &amp; Getting In<\u002Fh2>\n            <div style=\"margin-bottom:20px;\"><div style=\"font:600 17px/1.3 'Schibsted Grotesk';color:#2a3d49;margin-bottom:5px;\">Keyless entry<\u002Fdiv><p style=\"font:400 16.5px/1.6 'Hanken Grotesk';color:#46555f;margin:0;\">Your door has a personalized keypad code, sent to you before arrival. It's yours alone for the length of your stay, no keys to keep track of. Check-in is anytime after <strong style=\"color:#2a3d49;\">4:00 PM<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n            <div style=\"background:#eef2ee;border:1px solid #d8e0d6;border-left:4px solid #5b86a6;border-radius:8px;padding:18px 20px;margin-bottom:20px;\">\n              <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.16em;text-transform:uppercase;color:#5b86a6;margin-bottom:7px;\">Don't forget<\u002Fdiv>\n              <p style=\"font:400 16.5px/1.55 'Hanken Grotesk';color:#384a54;margin:0;\">The front door doesn't latch on   <div><div style=\"font:400 12px/1 'Hanken Grotesk';color:#8ba3b2;margin-bottom:5px;\">Password<\u002Fdiv><div style=\"font:600 22px/1 'Schibsted Grotesk';letter-spacing:.01em;\">pugetsound2020<\u002Fdiv><\u002Fdiv>\n                <button onclick=\"{{ copyWifi }}\" style=\"margin-left:auto;position:relative;border:none;background:#5b86a6;color:#fff;font:600 14px/1 'Hanken Grotesk';padding:12px 18px;border-radius:9px;cursor:pointer;\">Copy password<span ref=\"{{ copiedRef }}\" style=\"position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#2a3d49;color:#fff;font:600 12px/1 'Hanken Grotesk';padding:6px 10px;border-radius:6px;opacity:0;transition:opacity .2s;white-space:nowrap;\">Copied ✓<\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-bottom:18px;\"><div style=\"font:600 17px/1.3 'Schibsted Grotesk';color:#2a3d49;margin-bottom:5px;\">The TV<\u002Fdiv><p style=\"font:400 16.5px/1.6 'Hanken Grotesk';color:#46555f;margin:0;\">A smart TV with Netflix, Hulu, Prime Video, Disney+ and more, just sign in with your own accounts, and please sign out before you leave. There's cable, too, for the sports fans.<\u002Fp><\u002Fdiv>\n            <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:16px 18px;\"><div style=\"font:600 13px/1.3 'Schibsted Grotesk';color:#7a6a45;margin-bottom:4px;\">A note on the hum<\u002Fdiv><p style=\"font:400 15.5px/1.55 'Hanken Grotesk';color:#5c6770;margin:0;\">You may hear our plumbed-in dehumidifier, it keeps the cottage fresh and should mostly stay on. Feel free to turn off the power button while you watch a movie, then switch it back on after.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"f26f1063-f345-4b55-8c73-a3d273d84a12\" alt=\"Living room\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 5 · HOT TUB ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"ae29c9ff-a39b-443e-96e9-5915285dffd5\" alt=\"Deck with hot tub and water views\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 56px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">04 · Unwind<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 18px;\">The Saline Hot Tub<\u002Fh2>\n            <div style=\"display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;\">\n              <span style=\"background:#eef2ee;border:1px solid #d8e0d6;border-radius:999px;padding:7px 14px;font:600 13px/1 'Hanken Grotesk';color:#35586f;\">104°F<\u002Fspan>\n              <span style=\"background:#eef2ee;border:1px solid #d8e0d6;border-radius:999px;padding:7px 14px;font:600 13px/1 'Hanken Grotesk';color:#35586f;\">Saltwater · gentle on skin<\u002Fspan>\n              <span style=\"background:#eef2ee;border:1px solid #d8e0d6;border-radius:999px;padding:7px 14px;font:600 13px/1 'Hanken Grotesk';color:#35586f;\">Heated year-round<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font:400 16.5px/1.62 'Hanken Grotesk';color:#46555f;margin:0 0 18px;\">Our saline spa is professionally serviced before every stay and held around 104°F, and we can adjust it to your liking; just ask before you arrive. The mineral saltwater is soft on skin and eyes, perfect for easing muscles after a day exploring the island. In winter, enjoy the heated floor mats and optional aromatherapy.<\u002Fp>\n            <div style=\"font:600 14px/1 'Schibsted Grotesk';color:#7a6a45;margin:0 0 10px;\">A few good habits<\u002Fdiv>\n            <ul style=\"margin:0 0 16px;padding-left:20px;font:400 16px/1.7 'Hanken Grotesk';color:#46555f;\">\n              <li>Close and latch the cover after each soak; it keeps the water warm and clean.<\u002Fli>\n              <li>No glassware on the deck; we have a full set of outdoor dining supplies in the basement.<\u002Fli>\n              <li>Keep an eye on little ones: the deck has water views and limited fencing, and there's no gate or lock on the tub.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 6 · KITCHEN ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 56px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">05 · Cook<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 20px;\">The Kitchen<\u002Fh2>\n            <p style=\"font:400 17px/1.64 'Hanken Grotesk';color:#46555f;margin:0 0 18px;max-width:560px;\">It's the kitchen of your dreams, with Mount Baker and Puget Sound framed in the window over the sink. First-rate tools, an up-to-date cookbook collection, and room to make anything from a quick pizza to a five-course feast.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;max-width:560px;\">\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">KitchenAid stand mixer<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">Vitamix blender<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">Le Creuset Dutch oven<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">Slow cooker<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">Coffee &amp; the basics<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">A loved cookbook shelf<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">Rice cooker<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">Pancake griddle (above oven)<\u002Fdiv>\n              <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:13px 15px;font:500 15px/1.35 'Hanken Grotesk';color:#4a5a52;\">Instant Pot<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"f26f1063-f345-4b55-8c73-a3d273d84a12\" alt=\"Cottage interior\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 7 · GOOD TO KNOW (accordions) ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);\">\n          <div onclick=\"{{ accClick }}\" style=\"height:100%;overflow-y:auto;padding:54px 64px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">06 · Good to Know<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 6px;\">A Few Friendly Quirks<\u002Fh2>\n            <p style=\"font:400 16px/1.5 'Hanken Grotesk';color:#6a7882;margin:0 0 22px;max-width:620px;\">This cottage is almost 90 years old and full of character. Tap to expand each note.<\u002Fp>\n            <div style=\"max-width:720px;display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"background:#fff;border:1px solid #e7ddc9;border-radius:10px;overflow:hidden;\"><button data-acc=\"\" data-open=\"0\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;background:none;cursor:pointer;padding:16px 18px;text-align:left;font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Heat, room by room<span data-chev=\"\" style=\"transition:transform .3s;color:#5b86a6;font-size:14px;\">▾<\u002Fspan><\u002Fbutton><div data-acc-body=\"\" style=\"max-height:0;overflow:hidden;transition:max-height .4s ease;\"><p style=\"font:400 15.5px/1.6 'Hanken Grotesk';color:#46555f;margin:0;padding:0 18px 16px;\">Each room has its own thermostat, so warm just the spaces you're using. Cozy where you are, easy on the energy everywhere else.<\u002Fp><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e7ddc9;border-radius:10px;overflow:hidden;\"><button data-acc=\"\" data-open=\"0\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;background:none;cursor:pointer;padding:16px 18px;text-align:left;font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;\">The dehumidifier<span data-chev=\"\" style=\"transition:transform .3s;color:#5b86a6;font-size:14px;\">▾<\u002Fspan><\u002Fbutton><div data-acc-body=\"\" style=\"max-height:0;overflow:hidden;transition:max-height .4s ease;\"><p style=\"font:400 15.5px/1.6 'Hanken Grotesk';color:#46555f;margin:0;padding:0 18px 16px;\">Our plumbed-in dehumidifier keeps the cottage fresh and should mostly stay on. It can be a touch loud, so feel free to turn off the power button while watching TV, just remember to switch it back on after.<\u002Fp><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e7ddc9;border-radius:10px;overflow:hidden;\"><button data-acc=\"\" data-open=\"0\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;background:none;cursor:pointer;padding:16px 18px;text-align:left;font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Closets (or the lack of them)<span data-chev=\"\" style=\"transition:transform .3s;color:#5b86a6;font-size:14px;\">▾<\u002Fspan><\u002Fbutton><div data-acc-body=\"\" style=\"max-height:0;overflow:hidden;transition:max-height .4s ease;\"><p style=\"font:400 15.5px/1.6 'Hanken Grotesk';color:#46555f;margin:0;padding:0 18px 16px;\">There aren't really any closets in this old cottage, but there's plenty of clever storage: hooks throughout, a hanging rack, a small dresser, and roomy drawers under the king bed.<\u002Fp><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e7ddc9;border-radius:10px;overflow:hidden;\"><button data-acc=\"\" data-open=\"0\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;background:none;cursor:pointer;padding:16px 18px;text-align:left;font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Sap on the deck<span data-chev=\"\" style=\"transition:transform .3s;color:#5b86a6;font-size:14px;\">▾<\u002Fspan><\u002Fbutton><div data-acc-body=\"\" style=\"max-height:0;overflow:hidden;transition:max-height .4s ease;\"><p style=\"font:400 15.5px/1.6 'Hanken Grotesk';color:#46555f;margin:0;padding:0 18px 16px;\">Those beautiful trees drop a little sap and pine needles, especially in summer. There's a battery leaf blower if you'd like to tidy the deck during your stay, totally optional. In the metal bucket you'll find cleaning solutions to remove the sap.<\u002Fp><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e7ddc9;border-radius:10px;overflow:hidden;\"><button data-acc=\"\" data-open=\"0\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;background:none;cursor:pointer;padding:16px 18px;text-align:left;font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Pacific Northwest weather<span data-chev=\"\" style=\"transition:transform .3s;color:#5b86a6;font-size:14px;\">▾<\u002Fspan><\u002Fbutton><div data-acc-body=\"\" style=\"max-height:0;overflow:hidden;transition:max-height .4s ease;\"><p style=\"font:400 15.5px/1.6 'Hanken Grotesk';color:#46555f;margin:0;padding:0 18px 16px;\">There's no overhang at the front door, so when it rains you'll get the full island experience getting in. A hooded raincoat is your friend here far more than an umbrella.<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 8 · HOUSE RULES ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"d064adc3-5cfe-478a-9dbf-a83a0d385853\" alt=\"King bedroom\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 56px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">07 · House Rules<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 8px;\">House Rules<\u002Fh2>\n            <p style=\"font:400 16px/1.5 'Hanken Grotesk';color:#6a7882;margin:0 0 22px;\">Just enough to keep this a peaceful place for everyone.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:13px;\">\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.4;\">·<\u002Fspan><span style=\"font:400 16.5px/1.5 'Hanken Grotesk';color:#46555f;\">Check-in after <strong style=\"color:#2a3d49;\">4:00 PM<\u002Fstrong> · Checkout by <strong style=\"color:#2a3d49;\">11:00 AM<\u002Fstrong><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.4;\">·<\u002Fspan><span style=\"font:400 16.5px/1.5 'Hanken Grotesk';color:#46555f;\">Up to <strong style=\"color:#2a3d49;\">5 guests<\u002Fstrong>, this is a quiet retreat, not a party house<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.4;\">·<\u002Fspan><span style=\"font:400 16.5px/1.5 'Hanken Grotesk';color:#46555f;\">No smoking anywhere on the property, or all along the private road<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.4;\">·<\u002Fspan><span style=\"font:400 16.5px/1.5 'Hanken Grotesk';color:#46555f;\">Pull the front door firmly until it clicks whenever you head out<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.4;\">·<\u002Fspan><span style=\"font:400 16.5px/1.5 'Hanken Grotesk';color:#46555f;\">Supervise children near the hot tub, the deck, and the steep stairs<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.4;\">·<\u002Fspan><span style=\"font:400 16.5px/1.5 'Hanken Grotesk';color:#46555f;\">A little extra care with the white rugs and furnishings, please<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.4;\">·<\u002Fspan><span style=\"font:400 16.5px/1.5 'Hanken Grotesk';color:#46555f;\">Sound carries over the water in the evenings, keep it mellow after dark<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 9 · POWER & SAFETY ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 56px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">08 · Power &amp; Safety<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 18px;\">Power &amp; Safety<\u002Fh2>\n            <p style=\"font:400 16.5px/1.62 'Hanken Grotesk';color:#46555f;margin:0 0 18px;max-width:560px;\">Pacific Northwest winter storms can bring branches down, and sometimes the power with them. We've planned for it: a whole-house propane generator and a battery backup for the modem keep things running, and one of us is almost always close by if you need a hand.<\u002Fp>\n            <div style=\"font:600 14px/1 'Schibsted Grotesk';color:#7a6a45;margin:0 0 10px;\">Good to keep in mind<\u002Fdiv>\n            <ul style=\"margin:0 0 20px;padding-left:20px;font:400 16px/1.7 'Hanken Grotesk';color:#46555f;max-width:560px;\">\n              <li>The staircase is steep and the cottage sits on a bluff with limited fencing, so mind little ones.<\u002Fli>\n              <li>Our only security camera faces the parking area to keep an eye on the cars.<\u002Fli>\n              <li>Puget Sound is just below. It’s gorgeous, but keep an eye on children near the edge.<\u002Fli>\n            <\u002Ful>\n            <div style=\"background:#20303d;border-radius:12px;padding:18px 20px;color:#fff;max-width:560px;\">\n              <div style=\"font:600 11px/1 'Hanken Grotesk';letter-spacing:.18em;text-transform:uppercase;color:#9fc0d4;margin-bottom:8px;\">In an emergency<\u002Fdiv>\n              <p style=\"font:400 15.5px/1.55 'Hanken Grotesk';color:#dde6ec;margin:0;\">Call <strong style=\"color:#fff;\">911<\u002Fstrong> first. For anything about the house, message <strong style=\"color:#fff;\">Shannon &amp; Fiona<\u002Fstrong> anytime through Airbnb, we usually reply within the hour.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"a30d8556-7efd-4a28-b631-62191c7ecd9f\" alt=\"Water and sky view\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 10 · GETTING HERE ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"a30d8556-7efd-4a28-b631-62191c7ecd9f\" alt=\"Puget Sound and ferry route\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 56px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">09 · Getting Here<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 8px;\">Getting Here<\u002Fh2>\n            <p style=\"font:400 16px/1.5 'Hanken Grotesk';color:#6a7882;margin:0 0 20px;\">From SeaTac Airport, it's about an hour. Two lovely ways across:<\u002Fp>\n            <div style=\"display:flex;gap:14px;margin-bottom:14px;align-items:flex-start;\">\n              <div style=\"flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#5b86a6;color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px/1 'Schibsted Grotesk';\">1<\u002Fdiv>\n              <div><div style=\"font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;margin-bottom:3px;\">By ferry, the scenic way<\u002Fdiv><p style=\"font:400 15.5px/1.55 'Hanken Grotesk';color:#46555f;margin:0;\">Drive ~30 min to the Seattle ferry terminal, then ride the Seattle–Bainbridge ferry 35 minutes across the Sound. Or park in Seattle and walk on as a foot passenger.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:14px;margin-bottom:20px;align-items:flex-start;\">\n              <div style=\"flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#5b86a6;color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px/1 'Schibsted Grotesk';\">2<\u002Fdiv>\n              <div><div style=\"font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;margin-bottom:3px;\">By road, no ferry<\u002Fdiv><p style=\"font:400 15.5px/1.55 'Hanken Grotesk';color:#46555f;margin:0;\">Drive south and around via the Tacoma Narrows Bridge, about 1.5 hours. Handy if you'd rather not time a ferry.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:14px;margin-bottom:20px;align-items:flex-start;\">\n              <div style=\"flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#5b86a6;color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px/1 'Schibsted Grotesk';\">3<\u002Fdiv>\n              <div><div style=\"font:600 16.5px/1.3 'Schibsted Grotesk';color:#2a3d49;margin-bottom:3px;\">Need a hand?<\u002Fdiv><p style=\"font:400 15.5px/1.55 'Hanken Grotesk';color:#46555f;margin:0;\">Ask us if you need to rent a car or have questions about local transit, we're happy to help you sort out the best way to get around.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#eef2ee;border:1px solid #d8e0d6;border-radius:8px;padding:15px 17px;\"><p style=\"font:400 15.5px/1.55 'Hanken Grotesk';color:#384a54;margin:0;\">Once on the island, the cottage is an <strong>8-minute drive<\u002Fstrong> to the ferry and downtown Winslow. A car is handy here, park right in the driveway.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 11 · EXPLORE ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 56px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">10 · Explore<\u002Fdiv>\n            <h2 style=\"font:700 40px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:13px 0 20px;\">Explore the Island<\u002Fh2>\n            <div style=\"margin-bottom:18px;\"><div style=\"font:600 17px/1.3 'Schibsted Grotesk';color:#2a3d49;margin-bottom:4px;\">Walks &amp; beaches<\u002Fdiv><p style=\"font:400 16px/1.6 'Hanken Grotesk';color:#46555f;margin:0;\">Manitou Beach is a short walk or quick drive away. Rolling Bay has several gorgeous walking loops with water vistas, keep an eye out for eagles, osprey, and herons along the way.<\u002Fp><\u002Fdiv>\n            <div style=\"margin-bottom:18px;\"><div style=\"font:600 17px/1.3 'Schibsted Grotesk';color:#2a3d49;margin-bottom:4px;\">Downtown Winslow · 8 min<\u002Fdiv><p style=\"font:400 16px/1.6 'Hanken Grotesk';color:#46555f;margin:0;\">Shops, restaurants, a waterfront park, and the ferry terminal, the lively heart of Bainbridge Island.<\u002Fp><\u002Fdiv>\n            <div style=\"background:#f1ece1;border:1px solid #e3d9c5;border-radius:8px;padding:15px 17px;\"><p style=\"font:400 15.5px/1.55 'Hanken Grotesk';color:#5c6770;margin:0;\">And don't underestimate a slow morning on the deck with coffee and the view, it counts as an activity here.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:430px;position:relative;flex-shrink:0;\">\n            <img src=\"ae29c9ff-a39b-443e-96e9-5915285dffd5\" alt=\"Deck and water view\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 12 · EAT & DRINK + MAP ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;background:#f7f3ec;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);display:flex;\">\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:50px 52px;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#5b86a6;\">11 · Eat &amp; Drink<\u002Fdiv>\n            <h2 style=\"font:700 38px/1.04 'Schibsted Grotesk';letter-spacing:-0.015em;color:#20303d;margin:12px 0 6px;\">Eat &amp; Drink Nearby<\u002Fh2>\n            <p style=\"font:400 15px/1.5 'Hanken Grotesk';color:#6a7882;margin:0 0 18px;\">The Rolling Bay four-corners, all an easy walk away.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid #e7ddc9;padding-bottom:10px;\"><div><div style=\"font:600 16px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Rolling Bay Café<\u002Fdiv><div style=\"font:400 14px/1.4 'Hanken Grotesk';color:#6a7882;\">Coffee, pastries &amp; sandwiches<\u002Fdiv><\u002Fdiv><span style=\"font:500 13px/1 'Hanken Grotesk';color:#5b86a6;white-space:nowrap;\">Open 7 days<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid #e7ddc9;padding-bottom:10px;\"><div><div style=\"font:600 16px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Briny Bagels<\u002Fdiv><div style=\"font:400 14px/1.4 'Hanken Grotesk';color:#6a7882;\">Fresh-baked bagels<\u002Fdiv><\u002Fdiv><span style=\"font:500 13px/1 'Hanken Grotesk';color:#5b86a6;white-space:nowrap;\">Fri–Sun AM<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid #e7ddc9;padding-bottom:10px;\"><div><div style=\"font:600 16px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Via Rosa 11<\u002Fdiv><div style=\"font:400 14px/1.4 'Hanken Grotesk';color:#6a7882;\">Superb Italian, to-go<\u002Fdiv><\u002Fdiv><span style=\"font:500 13px/1 'Hanken Grotesk';color:#5b86a6;white-space:nowrap;\">Thu–Sun<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid #e7ddc9;padding-bottom:10px;\"><div><div style=\"font:600 16px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Bay Hay &amp; Feed<\u002Fdiv><div style=\"font:400 14px/1.4 'Hanken Grotesk';color:#6a7882;\">Small grocery, garden &amp; gifts<\u002Fdiv><\u002Fdiv><span style=\"font:500 13px/1 'Hanken Grotesk';color:#5b86a6;white-space:nowrap;\">Til 5 PM<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-bottom:2px;\"><div><div style=\"font:600 16px/1.3 'Schibsted Grotesk';color:#2a3d49;\">Rolling Bay Winery<\u002Fdiv><div style=\"font:400 14px/1.4 'Hanken Grotesk';color:#6a7882;\">Award-winning wines<\u002Fdiv><\u002Fdiv><span style=\"font:500 13px/1 'Hanken Grotesk';color:#5b86a6;white-space:nowrap;\">Wine only<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:430px;position:relative;flex-shrink:0;background:#dfe7e7;\">\n            <iframe title=\"Map of Rolling Bay, Bainbridge Island\" src=\"https://www.openstreetmap.org/export/embed.html?bbox=-122.5500%2C47.6480%2C-122.4600%2C47.6850&amp;layer=mapnik&amp;marker=47.6655%2C-122.5050\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;\"><\u002Fiframe>\n            <div style=\"position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border-radius:8px;padding:8px 12px;font:600 12px/1.3 'Hanken Grotesk';color:#2a3d49;box-shadow:0 6px 16px -6px rgba(20,40,55,.4);\">Rolling Bay · Bainbridge Island<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ LEAF 13 · CHECKOUT ============ -->\n        <div data-leaf=\"\" style=\"position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;transition:transform .82s cubic-bezier(.3,.7,.2,1);border-radius:8px;box-shadow:0 34px 70px -22px rgba(20,40,55,.42);background:#20303d;display:flex;\">\n          <div style=\"flex:1;height:100%;overflow-y:auto;padding:54px 58px;color:#fff;\">\n            <div style=\"font:600 12px/1 'Hanken Grotesk';letter-spacing:.26em;text-transform:uppercase;color:#9fc0d4;\">12 · Checkout<\u002Fdiv>\n            <h2 style=\"font:700 42px/1.02 'Schibsted Grotesk';letter-spacing:-0.018em;color:#fff;margin:13px 0 8px;\">Until Next Time<\u002Fh2>\n            <p style=\"font:400 16.5px/1.6 'Hanken Grotesk';color:#c6d3db;margin:0 0 22px;max-width:520px;\">Checkout is by <strong style=\"color:#fff;\">11:00 AM<\u002Fstrong>. No deep cleaning needed. Just a few quick things on your way out:<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:11px;max-width:520px;\">\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.35;\">•<\u002Fspan><span style=\"font:400 16px/1.4 'Hanken Grotesk';color:#dde6ec;\">Start the dishwasher if it's full<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.35;\">•<\u002Fspan><span style=\"font:400 16px/1.4 'Hanken Grotesk';color:#dde6ec;\">Bag any trash &amp; recycling<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.35;\">•<\u002Fspan><span style=\"font:400 16px/1.4 'Hanken Grotesk';color:#dde6ec;\">Turn off lights &amp; lower the heat in each room<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.35;\">•<\u002Fspan><span style=\"font:400 16px/1.4 'Hanken Grotesk';color:#dde6ec;\">Turn the dehumidifier's power button back on if you paused it<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:13px;align-items:flex-start;\"><span style=\"color:#5b86a6;font-size:18px;line-height:1.35;\">•<\u002Fspan><span style=\"font:400 16px/1.4 'Hanken Grotesk';color:#dde6ec;\">Pull the front door firmly until it clicks to lock<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font:400 16.5px/1.6 'Hanken Grotesk';color:#9fc0d4;margin:26px 0 0;max-width:520px;\">Your keypad code retires on its own, nothing to return. Thank you for treating Dahlia Bluff with such care. We hope you leave rested, and come back soon.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"width:400px;position:relative;flex-shrink:0;\">\n            <img src=\"83f75eb7-d0bb-45da-a338-9bc12ee5dc38\" alt=\"Dahlia Bluff Cottage\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- FOOTER BAR -->\n    <div style=\"margin-top:18px;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;\">\n      <button onclick=\"{{ tocClick }}\" data-go=\"1\" style=\"display:flex;align-items:center;gap:8px;border:1px solid #c8d2d2;background:rgba(255,255,255,.6);color:#35586f;font:600 13px/1 'Hanken Grotesk';padding:10px 16px;border-radius:999px;cursor:pointer;\">Contents<\u002Fbutton>\n      <div style=\"font:500 13px/1 'Hanken Grotesk';color:#6a7882;letter-spacing:.04em;\">Dahlia Bluff Cottage · page <span ref=\"{{ pageNumRef }}\" style=\"color:#2a3d49;font-weight:600;\">1<\u002Fspan> / 14<\u002Fdiv>\n      <div style=\"font:500 12px/1 'Hanken Grotesk';color:#94a0a4;letter-spacing:.02em;display:flex;align-items:center;gap:6px;\">Use <span style=\"font-size:14px;\">←<\u002Fspan> <span style=\"font-size:14px;\">→<\u002Fspan> to turn<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- LIGHTBOX -->\n  <div ref=\"{{ lbRef }}\" onclick=\"{{ closeLightbox }}\" style=\"position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,24,33,.86);z-index:999;opacity:0;transition:opacity .25s;cursor:zoom-out;backdrop-filter:blur(3px);\">\n    <img ref=\"{{ lbImgRef }}\" alt=\"\" style=\"max-width:86%;max-height:86%;border-radius:8px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);\">\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { idx: 0 };\n  total = 14;\n\n  componentDidMount() {\n    this.fit();\n    window.addEventListener('resize', this.fit);\n    window.addEventListener('keydown', this.onKey);\n    this.applyFlip();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.fit);\n    window.removeEventListener('keydown', this.onKey);\n  }\n  componentDidUpdate() { this.applyFlip(); }\n\n  onKey = (e) => {\n    if (e.key === 'ArrowRight' || e.key === 'PageDown') { this.next(); }\n    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { this.prev(); }\n    else if (e.key === 'Escape') { this.closeLightbox(); }\n  };\n\n  fit = () => {\n    const w = this.wrapEl;\n    if (!w) return;\n    const s = Math.min(window.innerWidth * 0.96 / 1180, window.innerHeight * 0.96 / 852);\n    w.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  };\n\n  applyFlip() {\n    const book = this.bookEl;\n    if (!book) return;\n    const leaves = Array.prototype.slice.call(book.querySelectorAll('[data-leaf]'));\n    const n = leaves.length;\n    leaves.forEach((leaf, i) => {\n      const flipped = i < this.state.idx;\n      leaf.style.transform = flipped ? 'rotateY(-178deg)' : 'rotateY(0deg)';\n      leaf.style.zIndex = String(flipped ? i : (n - i));\n      leaf.style.pointerEvents = (i === this.state.idx) ? 'auto' : 'none';\n    });\n    if (this.pageNumEl) this.pageNumEl.textContent = String(this.state.idx + 1);\n  }\n\n  go = (i) => {\n    const idx = Math.max(0, Math.min(this.total - 1, i));\n    if (idx !== this.state.idx) this.setState({ idx: idx });\n  };\n  next = () => this.go(this.state.idx + 1);\n  prev = () => this.go(this.state.idx - 1);\n\n  tocClick = (e) => {\n    const t = e.target.closest('[data-go]');\n    if (!t) return;\n    this.go(parseInt(t.getAttribute('data-go'), 10));\n  };\n\n  copyWifi = async () => {\n    try { await navigator.clipboard.writeText('pugetsound2020'); } catch (err) {}\n    const tip = this.copiedEl;\n    if (tip) {\n      tip.style.opacity = '1';\n      clearTimeout(this._copyT);\n      this._copyT = setTimeout(() => { tip.style.opacity = '0'; }, 1700);\n    }\n  };\n\n  accClick = (e) => {\n    const head = e.target.closest('[data-acc]');\n    if (!head) return;\n    const item = head.parentElement;\n    const body = item.querySelector('[data-acc-body]');\n    const chev = head.querySelector('[data-chev]');\n    const open = head.getAttribute('data-open') === '1';\n    if (open) {\n      body.style.maxHeight = '0px';\n      head.setAttribute('data-open', '0');\n      if (chev) chev.style.transform = 'rotate(0deg)';\n    } else {\n      body.style.maxHeight = body.scrollHeight + 'px';\n      head.setAttribute('data-open', '1');\n      if (chev) chev.style.transform = 'rotate(180deg)';\n    }\n  };\n\n  openLightbox = (e) => {\n    const t = e.target.closest('[data-full]');\n    if (!t) return;\n    const ov = this.lbEl, img = this.lbImgEl;\n    if (!ov || !img) return;\n    img.src = t.getAttribute('data-full');\n    ov.style.display = 'flex';\n    requestAnimationFrame(() => { ov.style.opacity = '1'; });\n  };\n  closeLightbox = () => {\n    const ov = this.lbEl;\n    if (!ov) return;\n    ov.style.opacity = '0';\n    setTimeout(() => { if (ov) ov.style.display = 'none'; }, 250);\n  };\n\n  renderVals() {\n    return {\n      wrapRef: (el) => { this.wrapEl = el; if (el) this.fit(); },\n      bookRef: (el) => { this.bookEl = el; },\n      pageNumRef: (el) => { this.pageNumEl = el; },\n      copiedRef: (el) => { this.copiedEl = el; },\n      lbRef: (el) => { this.lbEl = el; },\n      lbImgRef: (el) => { this.lbImgEl = el; },\n      prev: this.prev,\n      next: this.next,\n      tocClick: this.tocClick,\n      copyWifi: this.copyWifi,\n      accClick: this.accClick,\n      openLightbox: this.openLightbox,\n      closeLightbox: this.closeLightbox\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
